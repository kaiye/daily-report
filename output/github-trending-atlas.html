<title>GitHub 趋势仓库图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
:root{
  --ground:#F4F5F8; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --ink:#14171E; --ink-2:#565E6D; --ink-3:#8A91A0;
  --line:#E0E3E9; --line-2:#EDEFF3;
  --accent:#2D46C8; --accent-soft:#EDF0FC; --accent-ink:#1E2F8F;
  --s0:#E6EAFA; --s1:#C3CBF2; --s2:#94A2E6; --s3:#5C6FD6; --s4:#2D46C8; --s5:#1E2F8F;
  --hot:#C2410C; --hot-soft:#FBEDE6;
  --focus:#2D46C8;
  --shadow:0 1px 2px rgba(20,23,30,.05), 0 1px 10px rgba(20,23,30,.04);
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1115; --surface:#171A20; --surface-2:#1C1F26;
    --ink:#E8EBF0; --ink-2:#9BA3B2; --ink-3:#6B7484;
    --line:#272B34; --line-2:#20242B;
    --accent:#8195FF; --accent-soft:#1E2436; --accent-ink:#A6B3F5;
    --s0:#1F2434; --s1:#2C3763; --s2:#3B4C93; --s3:#5468C6; --s4:#7B8CE8; --s5:#A6B3F5;
    --hot:#D2601A; --hot-soft:#2A1D14;
    --focus:#8195FF;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 10px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1115; --surface:#171A20; --surface-2:#1C1F26;
  --ink:#E8EBF0; --ink-2:#9BA3B2; --ink-3:#6B7484;
  --line:#272B34; --line-2:#20242B;
  --accent:#8195FF; --accent-soft:#1E2436; --accent-ink:#A6B3F5;
  --s0:#1F2434; --s1:#2C3763; --s2:#3B4C93; --s3:#5468C6; --s4:#7B8CE8; --s5:#A6B3F5;
  --hot:#D2601A; --hot-soft:#2A1D14;
  --focus:#8195FF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 10px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1360px;margin:0 auto;padding:0 24px 72px}

/* ---------- masthead ---------- */
.masthead{padding:34px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow b{color:var(--accent);font-weight:500}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(30px,4.6vw,46px);line-height:1.04;
  letter-spacing:-.015em;margin:12px 0 0;text-wrap:balance}
.dek{color:var(--ink-2);max-width:60ch;margin:10px 0 0}
.dek code{font-family:var(--mono);font-size:.88em;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:9px;margin-top:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 16px;
  box-shadow:var(--shadow)}
.stat dt{font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stat dd{margin:3px 0 0;font-family:var(--cond);font-size:27px;font-weight:700;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.stat dd small{font-size:13px;font-weight:600;color:var(--ink-2);margin-left:3px;font-family:var(--sans)}
.stat.is-hot dd{color:var(--hot)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:302px minmax(0,1fr);gap:28px;align-items:start;margin-top:26px}
@media (max-width:900px){.cols{grid-template-columns:1fr;gap:20px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.panel-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:13px 15px 11px;border-bottom:1px solid var(--line-2)}
.panel-hd h2{font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);margin:0;font-weight:500}

/* ---------- category chart ---------- */
aside{position:sticky;top:16px}
@media (max-width:900px){aside{position:static}}
.metric-tog{display:flex;gap:2px;background:var(--line-2);border-radius:6px;padding:2px}
.metric-tog button{font:500 11px/1 var(--sans);color:var(--ink-2);background:none;border:0;cursor:pointer;
  padding:5px 8px;border-radius:4px}
.metric-tog button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.cats{padding:7px 8px 10px;display:flex;flex-direction:column}
.cat{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;
  width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:6px 7px;border-radius:6px;color:inherit;font:inherit;position:relative}
.cat:hover{background:var(--surface-2)}
.cat[aria-pressed="true"]{background:var(--accent-soft)}
.cat[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent)}
.cat-name{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:block;margin-bottom:4px;color:var(--ink-2)}
.cat[aria-pressed="true"] .cat-name{color:var(--ink);font-weight:600}
.cat-track{display:block;height:7px;background:var(--line-2);border-radius:2px;overflow:hidden}
.cat-bar{display:block;height:100%;background:var(--s3);border-radius:0 2px 2px 0;transition:width .22s ease}
.cat[aria-pressed="true"] .cat-bar{background:var(--s5)}
.cat-n{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;
  color:var(--ink-2);align-self:end;line-height:1.2}
.cat.is-empty{opacity:.55}
.cat.is-empty .cat-bar{background:var(--line)}

.legend{border-top:1px solid var(--line-2);padding:11px 15px 13px;display:flex;flex-direction:column;gap:9px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}
.legend-scale{display:flex;gap:2px}
.legend-scale i{width:13px;height:11px;border-radius:2px;display:block}
.dot-hot{width:7px;height:7px;border-radius:50%;background:var(--hot);flex:none}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:11px 13px}
.search{flex:1 1 210px;min-width:0;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;font:400 13.5px/1 var(--sans);color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:7px;padding:9px 30px 9px 31px}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
.search button{position:absolute;right:6px;background:none;border:0;cursor:pointer;color:var(--ink-3);
  padding:4px;line-height:0;border-radius:4px}
.search button:hover{color:var(--ink)}

.seg{display:flex;gap:2px;background:var(--line-2);border-radius:7px;padding:2px}
.seg button{font:500 12px/1 var(--sans);color:var(--ink-2);background:none;border:0;cursor:pointer;
  padding:7px 10px;border-radius:5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fld{display:flex;align-items:center;gap:7px}
.fld label{font-size:11px;font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
select{font:500 12.5px/1 var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
  border-radius:7px;padding:8px 9px;cursor:pointer}

.tally{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:9px 15px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.tally b{font-family:var(--mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--accent-soft);
  color:var(--accent-ink);border:1px solid transparent;border-radius:20px;padding:2px 4px 2px 9px}
.chip button{background:none;border:0;cursor:pointer;color:inherit;opacity:.65;padding:2px;line-height:0;
  border-radius:50%}
.chip button:hover{opacity:1}
.link-btn{background:none;border:0;cursor:pointer;color:var(--accent);font:500 12.5px/1 var(--sans);
  text-decoration:underline;text-underline-offset:3px;padding:2px}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) 128px 74px;gap:14px;align-items:start;
  padding:13px 15px;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.rk{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm a{font-family:var(--mono);font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none;
  border-bottom:1px solid var(--line);word-break:break-all}
.nm a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.tag{font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  border-radius:4px;padding:1px 6px;white-space:nowrap}
.row:hover .tag{background:var(--surface)}
.hot{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.desc{color:var(--ink-2);font-size:12.8px;margin-top:4px;max-width:78ch}

.spark{display:flex;gap:2px}
.spark i{flex:1;height:15px;border-radius:2px;display:block;background:var(--s0);
  box-shadow:inset 0 0 0 1px var(--line)}
.spark i[data-v="1"]{background:var(--s1);box-shadow:none}
.spark i[data-v="2"]{background:var(--s2);box-shadow:none}
.spark i[data-v="3"]{background:var(--s3);box-shadow:none}
.spark i[data-v="4"]{background:var(--s4);box-shadow:none}
.spark i[data-v="5"]{background:var(--s5);box-shadow:none}
.span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:5px;
  font-variant-numeric:tabular-nums;display:block}
.cnt{text-align:right}
.cnt b{font-family:var(--cond);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1;display:block}
.cnt span{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.cnt-track{display:block;height:4px;background:var(--line-2);border-radius:2px;margin-top:6px;overflow:hidden}
.cnt-bar{display:block;height:100%;background:var(--s3);border-radius:2px 0 0 2px;margin-left:auto}

@media (max-width:660px){
  .row{grid-template-columns:26px minmax(0,1fr) auto;gap:6px 10px;
    grid-template-areas:"rk main main" ". spk cnt"}
  .rk{grid-area:rk} .main{grid-area:main} .spk{grid-area:spk} .cnt{grid-area:cnt}
  .spk{display:flex;align-items:center;gap:10px;min-width:0}
  .spk .spark{flex:1;max-width:120px}
  .span{margin-top:0}
  .cnt{display:flex;align-items:baseline;gap:3px}
  .cnt b{font-size:17px}
  .cnt-track{display:none}
  .desc{font-size:12.4px}
}

.empty{padding:52px 20px;text-align:center;color:var(--ink-2)}
.empty p{margin:0 0 14px}
.more{padding:15px;text-align:center;border-top:1px solid var(--line-2)}
.more button{font:600 13px/1 var(--sans);color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:7px;padding:10px 20px;cursor:pointer}
.more button:hover{border-color:var(--accent);color:var(--accent)}

footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
footer code{font-family:var(--mono)}
</style>

<div class="wrap">
<header class="masthead">
  <div class="eyebrow"><b>daily-report</b><span>·</span><span>GitHub Trending 归档</span><span id="rangeLbl"></span></div>
  <h1>GitHub 趋势仓库图谱</h1>
  <p class="dek">来自 <code>output/*/github/report.md</code> 的每日趋势榜归档。按主题聚合，可按分类、活跃度与上榜次数筛选，简介取自各仓库最近一次上榜当天的报告。</p>
  <dl class="stats" id="stats"></dl>
</header>

<div class="cols">
  <aside>
    <div class="panel">
      <div class="panel-hd">
        <h2>分类聚合</h2>
        <div class="metric-tog" role="group" aria-label="聚合口径">
          <button type="button" data-metric="repos" aria-pressed="true">仓库数</button>
          <button type="button" data-metric="hits" aria-pressed="false">上榜次数</button>
        </div>
      </div>
      <div class="cats" id="cats"></div>
      <div class="legend">
        <div class="legend-row">
          <span>月度热度</span>
          <span class="legend-scale" aria-hidden="true">
            <i style="background:var(--s0);box-shadow:inset 0 0 0 1px var(--line)"></i>
            <i style="background:var(--s1)"></i><i style="background:var(--s2)"></i>
            <i style="background:var(--s3)"></i><i style="background:var(--s4)"></i><i style="background:var(--s5)"></i>
          </span>
          <span>0 → 5+ 次 / 月</span>
        </div>
        <div class="legend-row"><span class="dot-hot" aria-hidden="true"></span><span>近 30 天内仍有上榜</span></div>
      </div>
    </div>
  </aside>

  <main class="panel">
    <div class="controls">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="q" type="search" placeholder="搜索仓库名或简介，例如 记忆、TTS、alibaba" aria-label="搜索仓库名或简介" autocomplete="off">
        <button type="button" id="qClear" hidden aria-label="清空搜索">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="seg" role="group" aria-label="最近上榜时间">
        <button type="button" data-fresh="0" aria-pressed="true">全部</button>
        <button type="button" data-fresh="90" aria-pressed="false">近 90 天</button>
        <button type="button" data-fresh="30" aria-pressed="false">近 30 天</button>
      </div>
      <div class="seg" role="group" aria-label="最少上榜次数">
        <button type="button" data-min="1" aria-pressed="true">不限</button>
        <button type="button" data-min="3" aria-pressed="false">3+</button>
        <button type="button" data-min="5" aria-pressed="false">5+</button>
        <button type="button" data-min="10" aria-pressed="false">10+</button>
      </div>
      <div class="fld">
        <label for="sort">排序</label>
        <select id="sort">
          <option value="n">上榜次数</option>
          <option value="l">最近上榜</option>
          <option value="f">首次上榜</option>
          <option value="r">仓库名</option>
        </select>
      </div>
    </div>

    <div class="tally">
      <span><b id="hitCount">0</b> 个仓库 <span id="ofTotal"></span></span>
      <div class="chips" id="chips"></div>
    </div>

    <div class="rows" id="rows"></div>
    <div class="more" id="more" hidden><button type="button">显示更多</button></div>
  </main>
</div>

<footer>
  <span>数据窗口 <code id="rangeFoot"></code> · 192 天报告 · 1909 次上榜</span>
  <span>分类为基于仓库名与简介的启发式归类，单一主类。</span>
</footer>

  const PAGE = 60;

    ['报告天数', meta.days, '天'],
    ['主题分类', meta.cats.length, '类'],
    ['近 30 天仍在榜', hotN, '', 'is-hot'],
  ].map(([k,v,u,cls])=>
    `<div class="stat ${cls||''}"><dt>${k}</dt><dd>${v}${u?`<small>${u}</small>`:''}</dd></div>`).join('');

  /* ---- state ---- */
  const state = {q:'', cats:new Set(), fresh:0, min:1, sort:'n', metric:'repos', shown:PAGE};

  const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md = s => s.slice(5).replace('-','/');   // 2026-03-01 -> 03/01

  // rows passing every filter EXCEPT the category filter — drives the aggregate bars
  function baseSet(){
    const q = state.q.trim().toLowerCase();
    return rows.filter(r=>{
      if (r.n < state.min) return false;
      if (state.fresh && dayDiff(r.l, LAST) > state.fresh) return false;
      if (q && !(r.r.toLowerCase().includes(q) || r.d.toLowerCase().includes(q) || r.c.toLowerCase().includes(q))) return false;
      return true;
    });
  }
  function result(base){
    const out = state.cats.size ? base.filter(r=>state.cats.has(r.c)) : base.slice();
    const cmp = {
      n:(a,b)=> b.n-a.n || a.r.toLowerCase().localeCompare(b.r.toLowerCase()),
      l:(a,b)=> b.l.localeCompare(a.l) || b.n-a.n,
      f:(a,b)=> a.f.localeCompare(b.f) || b.n-a.n,
      r:(a,b)=> a.r.toLowerCase().localeCompare(b.r.toLowerCase()),
    }[state.sort];
    return out.sort(cmp);
  }

  /* ---- category chart ---- */
  const catsEl = document.getElementById('cats');
  catsEl.innerHTML = meta.cats.map(c=>
    `<button type="button" class="cat" data-cat="${esc(c.name)}" aria-pressed="false">
       <span>
         <span class="cat-name">${esc(c.name)}</span>
         <span class="cat-track"><span class="cat-bar" style="width:0%"></span></span>
       </span>
       <span class="cat-n">0</span>
     </button>`).join('');

  function drawCats(base){
    const agg = {};
    meta.cats.forEach(c=> agg[c.name] = {repos:0, hits:0});
    base.forEach(r=>{ agg[r.c].repos++; agg[r.c].hits += r.n; });
    const max = Math.max(1, ...meta.cats.map(c=> agg[c.name][state.metric]));
    catsEl.querySelectorAll('.cat').forEach(el=>{
      const name = el.dataset.cat, v = agg[name][state.metric];
      el.querySelector('.cat-bar').style.width = (v/max*100)+'%';
      el.querySelector('.cat-n').textContent = v;
      el.classList.toggle('is-empty', v===0);
      el.setAttribute('aria-pressed', state.cats.has(name));
      el.title = `${name} — ${agg[name].repos} 个仓库 · ${agg[name].hits} 次上榜`;
    });
  }

  /* ---- rows ---- */
  const rowsEl = document.getElementById('rows');
  const moreEl = document.getElementById('more');

  function rowHTML(r, i){
    const spark = r.m.map((v,k)=>
      `<i data-v="${Math.min(v,5)}" title="${meta.months[k]} · ${v} 次"></i>`).join('');
    return `<div class="row">
      <span class="rk">${i+1}</span>
      <div class="main">
        <div class="nm">
          <a href="https://github.com/${esc(r.r)}" target="_blank" rel="noopener noreferrer">${esc(r.r)}</a>
          <span class="tag">${esc(r.c)}</span>
          ${r.hot?'<span class="hot"><span class="dot-hot" aria-hidden="true"></span>仍在榜</span>':''}
        </div>
        <p class="desc">${esc(r.d)}</p>
      </div>
      <div class="spk">
        <div class="spark" role="img" aria-label="逐月上榜次数 ${r.m.join('、')}">${spark}</div>
        <span class="span">${md(r.f)} → ${md(r.l)}</span>
      </div>
      <div class="cnt">
        <b>${r.n}</b><span>次</span>
        <span class="cnt-track"><span class="cnt-bar" style="width:${Math.min(100, r.n/60*100)}%"></span></span>
      </div>
    </div>`;
  }

  function render(){
    const base = baseSet();
    drawCats(base);
    const res = result(base);

    document.getElementById('hitCount').textContent = res.length;
    document.getElementById('ofTotal').textContent =
      res.length === meta.repos ? '（全部）' : `/ ${meta.repos}`;

    const chips = [];
    state.cats.forEach(c=> chips.push(['cat', c, c]));
    if (state.fresh) chips.push(['fresh', state.fresh, `近 ${state.fresh} 天`]);
    if (state.min > 1) chips.push(['min', state.min, `${state.min}+ 次`]);
    if (state.q.trim()) chips.push(['q', '', `“${state.q.trim()}”`]);
    document.getElementById('chips').innerHTML = chips.length
      ? chips.map(([k,v,l])=>
          `<span class="chip">${esc(l)}<button type="button" data-drop="${k}" data-val="${esc(String(v))}" aria-label="移除筛选 ${esc(l)}">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l8 8M12 4l-8 8"/></svg>
          </button></span>`).join('') + '<button type="button" class="link-btn" id="clearAll">清除全部</button>'
      : '';

    if (!res.length){
      rowsEl.innerHTML = `<div class="empty"><p>没有仓库符合当前筛选条件。</p>
        <button type="button" class="link-btn" id="clearAll2">清除全部筛选</button></div>`;
      moreEl.hidden = true;
      return;
    }
    const slice = res.slice(0, state.shown);
    rowsEl.innerHTML = slice.map(rowHTML).join('');
    moreEl.hidden = res.length <= state.shown;
    if (!moreEl.hidden)
      moreEl.querySelector('button').textContent = `显示更多（还有 ${res.length - state.shown} 个）`;
  }

  /* ---- events ---- */
  const reset = ()=>{ state.shown = PAGE; render(); };

  catsEl.addEventListener('click', e=>{
    const b = e.target.closest('.cat'); if(!b) return;
    const c = b.dataset.cat;
    state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
    reset();
  });

  document.querySelector('.metric-tog').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.metric = b.dataset.metric;
    document.querySelectorAll('.metric-tog button').forEach(x=>
      x.setAttribute('aria-pressed', x === b));
    render();
  });

  const q = document.getElementById('q'), qClear = document.getElementById('qClear');
  let t; q.addEventListener('input', ()=>{
    clearTimeout(t); t = setTimeout(()=>{ state.q = q.value; qClear.hidden = !q.value; reset(); }, 130);
  });
  qClear.addEventListener('click', ()=>{ q.value=''; state.q=''; qClear.hidden=true; q.focus(); reset(); });

  document.querySelectorAll('.seg').forEach(seg=>{
    seg.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;
      seg.querySelectorAll('button').forEach(x=> x.setAttribute('aria-pressed', x === b));
      if ('fresh' in b.dataset) state.fresh = +b.dataset.fresh;
      else state.min = +b.dataset.min;
      reset();
    });
  });

  document.getElementById('sort').addEventListener('change', e=>{ state.sort = e.target.value; reset(); });

  moreEl.addEventListener('click', ()=>{ state.shown += PAGE * 2; render(); });

  document.getElementById('chips').addEventListener('click', e=>{
    const d = e.target.closest('[data-drop]');
    if (d){
      const k = d.dataset.drop;
      if (k === 'cat') state.cats.delete(d.dataset.val);
      if (k === 'fresh'){ state.fresh = 0; syncSeg('fresh', '0'); }
      if (k === 'min'){ state.min = 1; syncSeg('min', '1'); }
      if (k === 'q'){ state.q = ''; q.value = ''; qClear.hidden = true; }
      return reset();
    }
    if (e.target.id === 'clearAll') clearAll();
  });
  rowsEl.addEventListener('click', e=>{ if (e.target.id === 'clearAll2') clearAll(); });

  function syncSeg(key, val){
    document.querySelectorAll(`[data-${key}]`).forEach(x=>
      x.setAttribute('aria-pressed', x.dataset[key] === val));
  }
  function clearAll(){
    state.cats.clear(); state.fresh = 0; state.min = 1; state.q = '';
    q.value = ''; qClear.hidden = true;
    syncSeg('fresh','0'); syncSeg('min','1');
    reset();
  }

  render();
})();
</script>
