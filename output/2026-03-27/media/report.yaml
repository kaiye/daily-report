  content: 据报道苹果将在 iOS 27 开放 Siri 接口，允许 ChatGPT 等第三方 AI 聊天机器人接入，拓展 Siri 生态边界。
  url: https://www.theverge.com/tech/902048/apple-siri-ai-chatbot-update-ios-27
