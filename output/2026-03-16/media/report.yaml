date: "2026-03-16"
items:
  - source: "TechCrunch AI"
    content: "谷歌320亿美元收购云安全独角兽 Wiz，创下科技史上最大网络安全收购记录。投资人分析此举将助谷歌在多云安全领域与微软竞争，预计监管审查仍是关键变量。"
    url: "https://techcrunch.com/2026/03/15/wiz-investor-unpacks-googles-32b-acquisition/"

  - source: "TechCrunch AI"
    content: "字节跳动据报暂停视频生成模型 Seedance 2.0 的全球发布计划，此前已在中国市场上线，暂停原因尚未对外说明，引发业界对其海外扩张策略的猜测。"
    url: "https://techcrunch.com/2026/03/15/bytedance-reportedly-pauses-global-launch-of-its-seedance-2-0-video-generator/"

