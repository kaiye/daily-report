    content: "TiDB 联合创始人兼CTO推出 mem9.ai，为 Claude 等AI助手提供开箱即用的永续记忆服务，直接解决大模型上下文「失忆」痛点，发布一周即引爆开发者社区。"
    url: "https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652683211&idx=1&sn=03aaece4e7a0fd149f30205ce0a40875"

