    content: "一位科技创业者用 ChatGPT 结合基因检测数据为爱犬定制癌症疫苗，肿瘤缩小约50%，案例引发对AI辅助个性化医疗潜力的广泛关注，也推动更多人尝试将AI用于宠物和人类的癌症治疗。"
    url: "https://mp.weixin.qq.com/s?__biz=MzIzNjc1NzUzMw==&mid=2247874486&idx=1&sn=0f60078e24cbdf12a40345ace334435c"

